<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frua — Ніжність, загорнута в шоколад</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#f8f5f2]">

    <nav class="bg-white shadow sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <span class="text-4xl font-serif text-[#5c3314]">Frua</span>
            <div class="flex gap-8 text-lg">
                <a href="#catalog" class="hover:text-[#8b5a2b]">Каталог</a>
                <a href="#about" class="hover:text-[#8b5a2b]">Про нас</a>
                <a href="#delivery" class="hover:text-[#8b5a2b]">Доставка</a>
            </div>
            <button onclick="toggleCart()" class="text-3xl relative">
                <i class="fa-solid fa-bag-shopping"></i>
                <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
            </button>
        </div>
    </nav>

    <!-- Hero -->
    <section class="hero-bg h-screen flex items-center text-white text-center">
        <div class="max-w-4xl mx-auto px-6">
            <h1 class="text-6xl md:text-7xl font-serif">Ніжність, загорнута в шоколад</h1>
        </div>
    </section>

    <!-- Каталог -->
    <section id="catalog" class="py-20 bg-white">
        <div class="max-w-7xl mx-auto px-6">
            <h2 class="text-5xl font-serif text-center mb-12">Каталог</h2>
            <div id="products" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-8">
                <!-- Товари з'являться тут -->
            </div>
        </div>
    </section>

    <script src="script.js"></script>
    
    <!-- Додатковий запуск -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof renderProducts === "function") {
                renderProducts();
            }
        });
    </script>
</body>
</html>
